{% extends 'adminlayout.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 text-center text-success">Edit Train</h2>
  <form method="POST" action="{{ url_for('main.edit_train', train_id=train.id) }}" class="card p-4 shadow rounded">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="train_no" class="form-label">Train Number</label>
        <input type="text" class="form-control" name="train_no" value="{{ train.train_no }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" class="form-control" name="date" value="{{ train.date }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="from_station" class="form-label">From</label>
        <input type="text" class="form-control" name="from_station" value="{{ train.from_station }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="to_station" class="form-label">To</label>
        <input type="text" class="form-control" name="to_station" value="{{ train.to_station }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="departure_time" class="form-label">Departure Time</label>
        <input type="time" class="form-control" name="departure_time" value="{{ train.departure_time }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="arrival_time" class="form-label">Arrival Time</label>
        <input type="time" class="form-control" name="arrival_time" value="{{ train.arrival_time }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" step="0.01" class="form-control" name="price" value="{{ train.price }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="seats_available" class="form-label">Seats Available</label>
        <input type="number" class="form-control" name="seats_available" value="{{ train.seats_available }}" required>
      </div>
    </div>
    <button type="submit" class="btn btn-success w-100">Update Train</button>
    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Back</a>
  </form>
</div>
{% endblock %}
