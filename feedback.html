{% extends 'layout.html' %}
{% block content %}
<div class="form-container2 mt-5">
    <h3 class="form-title">Share Your Feedback</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Rating (1 to 5)</label>
            <input type="number" name="rating" class="form-control" min="1" max="5" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Your Suggestions / Review</label>
            <textarea name="comment" class="form-control" rows="4" required></textarea>
        </div>
        <button class="btn btn-success">Submit</button>
    </form>
</div>
{% endblock %}
