{% extends 'adminlayout.html' %}
{% block content %}
<div class="form-container2" align="center">
    <h2 class="mb-4 form-title">View Bookings by Category</h2>

    <div class="row" style="display: flex; justify-content: center; gap: 30px;">

        <!-- Flight Bookings -->
        <div class="card shadow-sm h-100 flight-card" style="width: 250px;">
            <div class="card-body text-center">
                <div class="icon" style="font-size: 40px; color: #3498db;">
                    <i class="fas fa-plane"></i>
                </div>
                <h5 class="card-title mt-2">Flight Bookings</h5>
                <a href="{{ url_for('main.view_flightbooking') }}" class="btn btn-primary mt-2">View Flights</a>
            </div>
        </div>

        <!-- Train Bookings -->
        <div class="card shadow-sm h-100 train-card" style="width: 250px;">
            <div class="card-body text-center">
                <div class="icon" style="font-size: 40px; color: #e67e22;">
                    <i class="fas fa-train"></i>
                </div>
                <h5 class="card-title mt-2">Train Bookings</h5>
                <a href="{{ url_for('main.view_trainbooking') }}" class="btn btn-warning mt-2">View Trains</a>
            </div>
        </div>

        <!-- Hotel Bookings -->
        <div class="card shadow-sm h-100 hotel-card" style="width: 250px;">
            <div class="card-body text-center">
                <div class="icon" style="font-size: 40px; color: #2ecc71;">
                    <i class="fas fa-hotel"></i>
                </div>
                <h5 class="card-title mt-2">Hotel Bookings</h5>
                <a href="{{ url_for('main.view_hotelbooking') }}" class="btn btn-success mt-2">View Hotels</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
