{% extends 'adminlayout.html' %}

{% block content %}
<div class="container mt-4">
    <h3 class="form-title">Add New Hotel</h3>
    <form method="POST" action="{{ url_for('main.add_hotel') }}">
        <div class="mb-3">
            <label class="form-label">Hotel Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">State (Location)</label>
            <select name="location" class="form-control" required>
                <option value="">Select State</option>
                <option value="Kerala">Kerala</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Rooms Available</label>
            <input type="number" name="rooms_available" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Price per Room (₹)</label>
            <input type="number" step="0.01" name="price_per_room" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Price per Night (₹)</label>
            <input type="number" step="0.01" name="price_per_night" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Available Date</label>
            <input type="date" name="date" class="form-control" required>
        </div>
        <button type="submit" class="btn1 btn-success">Add Hotel</button>
    </form>
</div>
{% endblock %}
