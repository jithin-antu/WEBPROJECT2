{% extends 'adminlayout.html' %}
{% block content %}
<div class="container mt-4">
    <h3>Add New Flight</h3>
    <form method="POST">
        <div class="mb-3">
            <label for="flight_no" class="form-label">Flight No</label>
            <input type="text" name="flight_no" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="from_location" class="form-label">From</label>
            <input type="text" name="from_location" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="to_location" class="form-label">To</label>
            <input type="text" name="to_location" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="departure_time" class="form-label">Departure Time</label>
            <input type="text" name="departure_time" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="arrival_time" class="form-label">Arrival Time</label>
            <input type="text" name="arrival_time" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date (YYYY-MM-DD)</label>
            <input type="text" name="date" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="seats_available" class="form-label">Seats Available</label>
            <input type="number" name="seats_available" class="form-control" required>
        </div>
        <button type="submit" class="btn1 btn-primary">Add Flight</button>
        <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
