{% extends 'adminlayout.html' %}

{% block content %}
<div class="form-container2 mt-5">
    <h2 class="mb-4 form-title">Admin Analytics Dashboard</h2>
    <div class="row text-center">
        <div class="col-md-4">
            <div class="analytics-card flight-analytics">
                <h4>Total Flight Bookings</h4>
                <p class="analytics-value">{{ total_flight_bookings }}</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="analytics-card train-analytics">
                <h4>Total Train Bookings</h4>
                <p class="analytics-value">{{ total_train_bookings }}</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="analytics-card hotel-analytics">
                <h4>Total Hotel Bookings</h4>
                <p class="analytics-value">{{ total_hotel_bookings }}</p>
            </div>
        </div>
    </div>

   <center><div class="text-center mt-4">
        <div class="revenue-highlight">
            <h3>Total Revenue</h3>
            <p class="revenue-amount">{{ total_revenue }}</p>
        </div>
    </div></center> 
</div>
{% endblock %}
